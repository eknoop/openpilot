name: "model review"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'selfdrive/modeld/models/*.onnx'
  workflow_dispatch:

concurrency:
  group: unraid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ${{ (github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && github.event_name != 'pull_request_review' && (!github.event.pull_request.head.repo.full_name || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "Linux", "X64", "roadie", "unraid"]') || fromJSON('["ubuntu-24.04"]') }}
    if: ${{ (github.event.pull_request.draft != true) && (github.repository == 'commaai/openpilot') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: base
      - run: git lfs pull
      - run: cd base && git lfs pull

      - run: pip install onnx

      - name: scripts/reporter.py
        id: report
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "## Model Review" >> $GITHUB_OUTPUT
          MASTER_PATH=${{ github.workspace }}/base python scripts/reporter.py >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post model report comment
        uses: marocchino/sticky-pull-request-comment@baa7203ed60924babbe5dcd0ac8eae3b66ec5e16
        with:
          header: model-review
          message: ${{ steps.report.outputs.content }}