name: release
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: unraid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build___nightly:
    name: build __nightly
    env:
      ImageOS: ubuntu24
    container:
      image: ghcr.io/sunnypilot/sunnypilot-base:latest
    runs-on: ${{ (github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && github.event_name != 'pull_request_review' && (!github.event.pull_request.head.repo.full_name || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "Linux", "X64", "roadie", "unraid"]') || fromJSON('["ubuntu-24.04"]') }}
    if: ${{ (github.event.pull_request.draft != true) && (github.repository == 'sunnypilot/sunnypilot') }}
    permissions:
      checks: read
      contents: write
    steps:
    - name: Install wait-on-check-action dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libyaml-dev
    - name: Wait for green check mark
      if: ${{ github.event_name == 'schedule' }}
      uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc
      with:
        ref: master
        wait-interval: 30
        running-workflow-name: 'build __nightly'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        check-regexp: ^((?!.*(build prebuilt).*).)*$
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    - name: Pull LFS
      run: |
        git config --global --add safe.directory '*'
        git lfs pull
    - name: Push __nightly
      run: BRANCH=__nightly release/build_devel.sh
