name: weekly CI test run
on:
  workflow_call:
    inputs:
      run_number:
        required: true
        type: string

concurrency:
  group: unraid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.run_number || '1' }}
  cancel-in-progress: true

jobs:
  selfdrive_tests:
    if: ${{ github.event.pull_request.draft != true }}
    uses: ./.github/workflows/selfdrive_tests.yaml
    with:
      run_number: ${{ inputs.run_number }}
