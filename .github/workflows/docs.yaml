name: docs

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: false
        type: string
concurrency:
  group: unraid-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.run_number || '1' }}
  cancel-in-progress: true

jobs:
  docs:
    if: ${{ github.event.pull_request.draft != true }}
    name: build docs
    runs-on: ${{ (github.event_name != 'pull_request_target' && github.event_name != 'issue_comment' && github.event_name != 'pull_request_review' && (!github.event.pull_request.head.repo.full_name || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "Linux", "X64", "roadie", "unraid"]') || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: commaai/timeout@v1

    - uses: actions/checkout@v4
      with:
        submodules: true

    # Build
    - name: Build docs
      run: |
        # TODO: can we install just the "docs" dependency group without the normal deps?
        pip install mkdocs
        mkdocs build

    # Push to docs.comma.ai
    - uses: actions/checkout@v4
      if: github.ref == 'refs/heads/master' && github.repository == 'sunnypilot/sunnypilot'
      with:
        path: openpilot-docs
        ssh-key: ${{ secrets.OPENPILOT_DOCS_KEY }}
        repository: sunnypilot/sunnypilot-docs
    - name: Push
      if: github.ref == 'refs/heads/master' && github.repository == 'sunnypilot/sunnypilot'
      run: |
        set -x

        source release/identity.sh

        cd openpilot-docs
        git checkout --orphan tmp
        git rm -rf .

        # copy over docs
        cp -r ../docs_site/ docs/

        # GitHub pages config
        touch docs/.nojekyll
        echo -n docs.comma.ai > docs/CNAME

        git add -f .
        git commit -m "build docs"

        # docs live in different repo to not bloat openpilot's full clone size
        git push -f origin tmp:gh-pages
